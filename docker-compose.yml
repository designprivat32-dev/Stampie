services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stampie
    ports:
      - '5432:5432'
    volumes:
      - stampie-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stampie']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stampie-db:
