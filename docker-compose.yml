services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stemply
    ports:
      - '5432:5432'
    volumes:
      - stemply-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stemply']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stemply-db:
